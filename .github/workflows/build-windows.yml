name: Build Top Speed Arabic Enhanced

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Upgrade legacy Visual Studio solutions
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $devenv = Join-Path $vsPath "Common7\IDE\devenv.com"
          if (-not (Test-Path $devenv)) { throw "Visual Studio devenv.com was not found at $devenv" }
          $solutions = @(
            "vs_projects/common/CommonStatic.sln",
            "vs_projects/dxcommon/DxCommonStatic.sln",
            "vs_projects/topspeed/TopSpeed.sln"
          )
          foreach ($solution in $solutions) {
            Write-Host "Upgrading $solution"
            & $devenv $solution /Upgrade
            if ($LASTEXITCODE -ne 0) { throw "Visual Studio upgrade failed for $solution" }
          }

      - name: Install legacy DirectX SDK
        shell: pwsh
        run: |
          $exe = "$env:TEMP\DXSDK_Jun10.exe"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe" -OutFile $exe
          $install = "C:\Program Files (x86)\Microsoft DirectX SDK"
          Start-Process -FilePath $exe -ArgumentList "/P `"$install`" /U" -Wait -NoNewWindow
          New-Item -ItemType Directory -Force -Path vs_projects/dxsdk | Out-Null
          Copy-Item "$install\Include" vs_projects/dxsdk -Recurse -Force
          Copy-Item "$install\Lib" vs_projects/dxsdk -Recurse -Force

      - name: Install OGG and Vorbis with vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP\vcpkg\vcpkg.exe" install libogg:x86-windows-static libvorbis:x86-windows-static --clean-after-build
          $root = "$env:RUNNER_TEMP\vcpkg\installed\x86-windows-static"
          New-Item -ItemType Directory -Force -Path vs_projects/ogg,vs_projects/vorbis | Out-Null
          Copy-Item "$root\include\ogg" vs_projects/ogg -Recurse -Force
          Copy-Item "$root\include\vorbis" vs_projects/vorbis -Recurse -Force
          Copy-Item "$root\lib\ogg.lib" vs_projects/topspeed/ogg_static.lib -Force
          Copy-Item "$root\lib\vorbis.lib" vs_projects/topspeed/vorbis_static.lib -Force
          Copy-Item "$root\lib\vorbisfile.lib" vs_projects/topspeed/vorbisfile_static.lib -Force

      - name: Build CommonStatic
        run: msbuild vs_projects/common/CommonStatic.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Stage CommonStatic for DxCommon
        shell: pwsh
        run: |
          Copy-Item vs_projects/Output/CommonStatic.lib vs_projects/dxcommon/CommonStatic.lib -Force

      - name: Build DxCommonStatic
        run: msbuild vs_projects/dxcommon/DxCommonStatic.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Stage static libraries
        shell: pwsh
        run: |
          Copy-Item vs_projects/Output/CommonStatic.lib vs_projects/topspeed/CommonStatic.lib -Force
          Copy-Item vs_projects/Output/DxCommonStatic.lib vs_projects/topspeed/DxCommonStatic.lib -Force

      - name: Build Release Win32
        run: msbuild vs_projects/topspeed/TopSpeed.sln /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

      - name: Package game files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item installer/tspeed/* dist -Recurse -Force
          Get-ChildItem -Path vs_projects -Recurse -Filter *.exe | Copy-Item -Destination dist -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TopSpeed-Arabic-Enhanced-Windows
          path: dist
          if-no-files-found: error
